name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query pack still gets applied to code that
    # has not changed. Delivery is unreliable to the hour; that is fine here.
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    # release-please and spec-sync open their pull requests with the default
    # GITHUB_TOKEN, and GitHub does not execute workflow runs for those: it
    # creates the run, allocates no job, and concludes it red. Skipping at the
    # job level makes the run conclude `skipped` instead, which is honest.
    #
    # This has to be a job-level `if` on head_ref. An `on.pull_request.branches-ignore`
    # filter matches the *base* branch, and these pull requests target main like
    # any other, so it excluded nothing at all.
    if: >-
      github.head_ref != 'release-please--branches--main' &&
      github.head_ref != 'chore/spec-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # A job per language is unavoidable here: CodeQL builds one database per
        # language and the action does not accept several in one run.
        include:
          - language: javascript-typescript
          - language: java-kotlin
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node.js
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build the Kotlin client
        if: matrix.language == 'java-kotlin'
        working-directory: kotlin
        run: ./gradlew classes --no-daemon

      - name: Perform the analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
