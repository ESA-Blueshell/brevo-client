name: Scorecard

# OpenSSF Scorecard. Reports supply-chain posture (pinned actions, branch
# protection, token permissions) into the repository's security tab.

on:
  branch_protection_rule:
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyse:
    name: Run the analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
